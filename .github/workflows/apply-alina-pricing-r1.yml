name: Apply Alina Pricing R1

on:
  push:
    branches:
      - agent/alina-pricing-r1

permissions:
  contents: write

jobs:
  apply-pricing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alina-pricing-r1
          fetch-depth: 0

      - name: Apply approved pricing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def replace_exact(path, old, new, expected=1):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Homepage: keep the trust strip compact and premium; FAQ remains concise.
          replace_exact(
              'index.html',
              '<p>600<br>грн</p>',
              '<p class="trust-price"><span class="trust-price-primary">20 €</span><span class="trust-price-secondary">(1 000 грн)</span></p>'
          )
          replace_exact(
              'ru/index.html',
              '<p>600<br>грн</p>',
              '<p class="trust-price"><span class="trust-price-primary">20 €</span><span class="trust-price-secondary">(1 000 грн)</span></p>'
          )

          # Consultation pages: canonical EUR price, visible UAH counterpart, package only in the two pricing-detail areas.
          replace_exact(
              'consultations/index.html',
              '"offers": {\n          "@type": "Offer",\n          "price": "600",\n          "priceCurrency": "UAH",\n          "description": "Тривалість консультації — 50 хвилин. Онлайн; очно — за попереднім погодженням."\n        }',
              '"offers": {\n          "@type": "Offer",\n          "price": "20",\n          "priceCurrency": "EUR",\n          "description": "Тривалість консультації — 50 хвилин. Стандартна вартість — 20 € (1 000 грн). Пакет із 10 консультацій — 7 700 грн (770 грн за консультацію). Онлайн; очно — за попереднім погодженням."\n        }'
          )
          replace_exact(
              'ru/consultations/index.html',
              '"offers": {\n          "@type": "Offer",\n          "price": "600",\n          "priceCurrency": "UAH",\n          "description": "Продолжительность консультации — 50 минут. Онлайн; очно — по предварительному согласованию."\n        }',
              '"offers": {\n          "@type": "Offer",\n          "price": "20",\n          "priceCurrency": "EUR",\n          "description": "Продолжительность консультации — 50 минут. Стандартная стоимость — 20 € (1 000 грн). Пакет из 10 консультаций — 7 700 грн (770 грн за консультацию). Онлайн; очно — по предварительному согласованию."\n        }'
          )
          replace_exact(
              'consultations/index.html',
              '<span><strong>600</strong> грн</span>',
              '<span class="consult-price-fact"><strong>20 €</strong><small class="price-alt">(1 000 грн)</small></span>'
          )
          replace_exact(
              'ru/consultations/index.html',
              '<span><strong>600</strong> грн</span>',
              '<span class="consult-price-fact"><strong>20 €</strong><small class="price-alt">(1 000 грн)</small></span>'
          )
          replace_exact(
              'consultations/index.html',
              '<small>Онлайн · 50 хвилин · 600 грн</small>',
              '<small class="consult-price-summary"><span>Онлайн · 50 хвилин · 20 € (1 000 грн)</span><span class="package-price">10 консультацій · 770 грн / консультація · 7 700 грн за пакет</span></small>'
          )
          replace_exact(
              'ru/consultations/index.html',
              '<small>Онлайн · 50 минут · 600 грн</small>',
              '<small class="consult-price-summary"><span>Онлайн · 50 минут · 20 € (1 000 грн)</span><span class="package-price">10 консультаций · 770 грн / консультация · 7 700 грн за пакет</span></small>'
          )
          replace_exact(
              'consultations/index.html',
              '<div role="listitem" data-reveal><span>Вартість</span><strong>600 грн</strong><p>Актуальна вартість індивідуальної консультації.</p></div>',
              '<div role="listitem" data-reveal><span>Вартість</span><strong><span class="price-main">20 €</span><small class="price-alt">(1 000 грн)</small></strong><p>Разова індивідуальна консультація. Пакет із 10 консультацій — 770 грн за консультацію, 7 700 грн за пакет.</p></div>'
          )
          replace_exact(
              'ru/consultations/index.html',
              '<div role="listitem" data-reveal><span>Стоимость</span><strong>600 грн</strong><p>Актуальная стоимость индивидуальной консультации.</p></div>',
              '<div role="listitem" data-reveal><span>Стоимость</span><strong><span class="price-main">20 €</span><small class="price-alt">(1 000 грн)</small></strong><p>Разовая индивидуальная консультация. Пакет из 10 консультаций — 770 грн за консультацию, 7 700 грн за пакет.</p></div>'
          )

          # Replace any remaining plain-text legacy public price, including homepage FAQ and first-consultation articles.
          for p in ROOT.rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              text = text.replace('600 грн', '20 € (1 000 грн)')
              p.write_text(text, encoding='utf-8')

          # Premium hierarchy on the homepage trust strip.
          css = ROOT / 'assets/css/site.v3-1.css'
          text = css.read_text(encoding='utf-8')
          marker = '.trust-price-primary'
          if marker in text:
              raise SystemExit('site.v3-1.css: trust price styles already present unexpectedly')
          insert_after = '.trust-grid p:last-child { border-right: 1px solid var(--line); }\n'
          addition = '''\n.trust-grid p.trust-price {\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  gap: 5px;\n}\n.trust-price-primary {\n  display: block;\n  font-size: 19px;\n  line-height: 1;\n}\n.trust-price-secondary {\n  display: block;\n  color: var(--muted);\n  font-family: var(--sans);\n  font-size: 10px;\n  font-weight: 500;\n  line-height: 1.15;\n  letter-spacing: .01em;\n}\n'''
          if insert_after not in text:
              raise SystemExit('site.v3-1.css: trust-grid insertion point missing')
          css.write_text(text.replace(insert_after, insert_after + addition, 1), encoding='utf-8')

          # Premium hierarchy for price/currency and the package line on consultation pages.
          css = ROOT / 'assets/css/site.consultations.v1.css'
          text = css.read_text(encoding='utf-8')
          if '.consult-price-summary' in text:
              raise SystemExit('site.consultations.v1.css: pricing styles already present unexpectedly')
          addition = '''\n\n/* Pricing R1: primary EUR price, restrained UAH counterpart, and package detail. */\n.consult-hero-facts .consult-price-fact .price-alt {\n  display: block;\n  margin-top: 6px;\n  color: var(--muted);\n  font-family: var(--sans);\n  font-size: 10px;\n  font-weight: 500;\n  line-height: 1.2;\n  letter-spacing: .015em;\n  text-transform: none;\n}\n.consult-format-grid small.consult-price-summary {\n  display: flex;\n  flex-direction: column;\n  gap: 9px;\n}\n.consult-format-grid .package-price {\n  color: var(--terracotta);\n  font-family: var(--sans);\n  font-size: 10px;\n  font-weight: 600;\n  line-height: 1.45;\n  letter-spacing: .025em;\n}\n.condition-ledger .price-main {\n  display: block;\n}\n.condition-ledger strong .price-alt {\n  display: block;\n  margin-top: 6px;\n  color: var(--muted);\n  font-family: var(--sans);\n  font-size: 11px;\n  font-weight: 500;\n  line-height: 1.2;\n  letter-spacing: .015em;\n}\n'''
          css.write_text(text.rstrip() + addition + '\n', encoding='utf-8')

          # Keep the canonical consultation validator aligned with the new pricing contract.
          validator = ROOT / 'scripts/validate-consultations-pages-v1.py'
          text = validator.read_text(encoding='utf-8')
          old = 'require(\'priceCurrency": "UAH"\' in text and \'"price": "600"\' in text, f"{relative}: price schema mismatch")'
          new = 'require(\'priceCurrency": "EUR"\' in text and \'"price": "20"\' in text, f"{relative}: price schema mismatch")'
          if text.count(old) != 1:
              raise SystemExit('validate-consultations-pages-v1.py: schema assertion mismatch')
          text = text.replace(old, new)
          old = "require('50' in text and '600' in text, f\"{relative}: confirmed duration/price missing\")"
          new = "require('50' in text and '20 €' in text and '1 000 грн' in text and '770 грн' in text and '7 700 грн' in text, f\"{relative}: confirmed duration/price missing\")\n    require('600 грн' not in text and '\"price\": \"600\"' not in text, f\"{relative}: legacy price remains\")"
          if text.count(old) != 1:
              raise SystemExit('validate-consultations-pages-v1.py: visible price assertion mismatch')
          validator.write_text(text.replace(old, new), encoding='utf-8')

          # Repository-wide public HTML guard: no legacy price may remain.
          stale = []
          patterns = [
              re.compile(r'600\s*грн'),
              re.compile(r'<strong>600</strong>\s*грн'),
              re.compile(r'600<br>грн'),
              re.compile(r'"price"\s*:\s*"600"'),
          ]
          for p in ROOT.rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              if any(pattern.search(text) for pattern in patterns):
                  stale.append(str(p))
          if stale:
              raise SystemExit('Legacy public price remains in: ' + ', '.join(stale))

          # Confirm exact package placement: two visible locations per language on consultations pages.
          checks = {
              'consultations/index.html': ['770 грн / консультація', '770 грн за консультацію, 7 700 грн за пакет'],
              'ru/consultations/index.html': ['770 грн / консультация', '770 грн за консультацию, 7 700 грн за пакет'],
          }
          for path, needles in checks.items():
              text = (ROOT / path).read_text(encoding='utf-8')
              for needle in needles:
                  if text.count(needle) != 1:
                      raise SystemExit(f'{path}: expected one package marker: {needle!r}')

          print('Pricing R1 content transformation passed')
          PY

      - name: Run focused validation
        shell: bash
        run: |
          python scripts/validate-consultations-pages-v1.py
          python scripts/validate-article-v32.py
          python - <<'PY'
          from pathlib import Path
          for path in ('index.html', 'ru/index.html'):
              text = Path(path).read_text(encoding='utf-8')
              assert '600<br>грн' not in text
              assert '600 грн' not in text
              assert '20 €' in text and '1 000 грн' in text
          print('Homepage pricing guard passed')
          PY

      - name: Commit approved pricing update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ru/index.html consultations/index.html ru/consultations/index.html \
            notes/first-consultation/index.html ru/notes/first-consultation/index.html \
            assets/css/site.v3-1.css assets/css/site.consultations.v1.css \
            scripts/validate-consultations-pages-v1.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No pricing changes to commit"
            exit 1
          fi
          git commit -m "Update consultation pricing"
          git push origin HEAD:agent/alina-pricing-r1
