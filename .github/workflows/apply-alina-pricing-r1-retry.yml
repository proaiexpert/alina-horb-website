name: Apply Alina Pricing R1 Retry

on:
  push:
    branches:
      - agent/alina-pricing-r1

permissions:
  contents: write

jobs:
  apply-pricing-retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alina-pricing-r1
          fetch-depth: 0

      - name: Reuse approved transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-alina-pricing-r1.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('Approved transformation block not found')
          block = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          exec(compile(textwrap.dedent(block), 'pricing-r1-transform', 'exec'))

          # Normalize final newline so git diff --check remains clean.
          css = Path('assets/css/site.consultations.v1.css')
          css.write_text(css.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Run focused validation
        shell: bash
        run: |
          python scripts/validate-consultations-pages-v1.py
          python scripts/validate-article-v32.py
          python - <<'PY'
          from pathlib import Path
          for path in ('index.html', 'ru/index.html'):
              text = Path(path).read_text(encoding='utf-8')
              assert '600<br>грн' not in text
              assert '600 грн' not in text
              assert '20 €' in text and '1 000 грн' in text
          print('Homepage pricing guard passed')
          PY

      - name: Commit approved pricing update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ru/index.html consultations/index.html ru/consultations/index.html \
            notes/first-consultation/index.html ru/notes/first-consultation/index.html \
            assets/css/site.v3-1.css assets/css/site.consultations.v1.css \
            scripts/validate-consultations-pages-v1.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No pricing changes to commit"
            exit 1
          fi
          git commit -m "Update consultation pricing"
          git push origin HEAD:agent/alina-pricing-r1
